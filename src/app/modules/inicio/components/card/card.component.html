<div class="row">
    <div class="col-3" *ngFor="let producto of coleccionProducto2">
      
        <div class="card" style="width: 18rem;">
            <img style="width: 286px; height: 286px;" src="{{producto.imagen}}" class="card-img-top" alt="...">
            <div class="card-body">
              <h3 class="card-title">{{producto.nombre}}</h3>
              <p class="card-text">{{producto.descripcion}}</p>
              <button class="btn btn-primary">Agregar</button>
            </div>
          </div>
    </div>
</div>
